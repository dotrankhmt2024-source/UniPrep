# Quy ước nhãn (labels) của repo UniPrep.
#
# File này là NGUỒN DUY NHẤT của danh sách nhãn. GitHub không tự đọc file này;
# tạo nhãn bằng một trong hai cách:
#
#   gh label create "P0" --color B60205 --description "..."      # thủ công
#   gh label clone <repo-mẫu>                                     # không dùng
#
# hoặc dán từng dòng dưới đây vào GitHub REST API
#   POST /repos/dotrankhmt2024-source/UniPrep/labels  {"name":...,"color":...,"description":...}
#
# Tiền tố nhóm giúp lọc nhanh: `type:`, `priority:`, `area:`.
# Mọi issue/PR phải có ĐÚNG MỘT nhãn `type:` và ĐÚNG MỘT nhãn `priority:`.

# ----- Loại công việc -----
- name: 'type: feature'
  color: '1D76DB'
  description: 'Tính năng hoặc task mới theo WBS'
- name: 'type: bug'
  color: 'D73A4A'
  description: 'Lỗi đã tái hiện được'
- name: 'type: docs'
  color: '0075CA'
  description: 'Tài liệu, quy ước, README'
- name: 'type: test'
  color: 'FBCA04'
  description: 'Kiểm thử, fixture, đo hiệu năng'
- name: 'type: chore'
  color: 'C5DEF5'
  description: 'Việc hạ tầng nhỏ: CI, dependency, cấu hình'
- name: 'type: refactor'
  color: 'BFD4F2'
  description: 'Đổi cấu trúc code, không đổi hành vi'

# ----- Ưu tiên (theo mục 2.4 của implementation-plan) -----
- name: 'priority: P0'
  color: 'B60205'
  description: 'Bắt buộc, chặn tiêu chí demo hoặc chặn việc khác'
- name: 'priority: P1'
  color: 'D93F0B'
  description: 'Quan trọng nhưng có thể trượt nếu hết thời gian'
- name: 'priority: P2'
  color: 'FBCA04'
  description: 'Có thì tốt; là ứng viên cắt đầu tiên'

# ----- Khu vực (khớp cột "Nhãn" trong WBS) -----
- name: 'area: backend'
  color: '0E8A16'
  description: 'NestJS API (backend/)'
- name: 'area: frontend'
  color: '5319E7'
  description: 'React SPA (frontend/)'
- name: 'area: ai'
  color: '8A2BE2'
  description: 'FastAPI, model, feature, dữ liệu mô phỏng'
- name: 'area: db'
  color: '006B75'
  description: 'Schema, migration, seed, truy vấn'
- name: 'area: devops'
  color: 'BFDADC'
  description: 'CI/CD, môi trường, deploy, Docker'
- name: 'area: docs'
  color: 'C2E0C6'
  description: 'Tài liệu, wireframe, spec'

# ----- Trạng thái -----
- name: 'status: blocked'
  color: '000000'
  description: 'Đang chờ việc khác hoặc chờ quyết định của nhóm'
- name: 'status: needs-review'
  color: 'F9D0C4'
  description: 'Chờ người khác review'
- name: 'status: duplicate'
  color: 'CFD3D7'
  description: 'Trùng với issue khác'
