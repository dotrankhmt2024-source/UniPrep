name: CI

on:
  push:
    branches: [develop, main, Thien_dev]
  pull_request:
    branches: [develop, main, Thien_dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # Không dùng `npm run lint`: script đó là
      #   eslint "src/**/*.ts" --fix
      # Trên CI không được dùng --fix: CI phải BÁO LỖI, không tự sửa rồi báo xanh.
      - name: Lint
        run: npx eslint "src/**/*.ts"

      - name: Build
        run: npm run build
